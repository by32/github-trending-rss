[project]
name = "github-trending-rss"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40,<1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
